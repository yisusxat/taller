<svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g14001" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="emeraldRing" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow14001" x="-10" y="-10" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#091a18" stroke="url(#emeraldRing)" stroke-width="1.8" filter="url(#glow14001)"/>
  <circle cx="50" cy="50" r="42" stroke="rgba(52, 211, 153, 0.4)" stroke-width="0.75" stroke-dasharray="2 2"/>
  <!-- Middle Ring -->
  <circle cx="50" cy="50" r="38" fill="url(#g14001)" fill-opacity="0.18" stroke="#34d399" stroke-width="1.2"/>
  <!-- Top Arc Text / Label -->
  <path id="arc14001" d="M 22 50 A 28 28 0 0 1 78 50" fill="none"/>
  <text font-family="'Inter', system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#a7f3d0" letter-spacing="1.2">
    <textPath href="#arc14001" startOffset="50%" text-anchor="middle">MEDIO AMBIENTE</textPath>
  </text>
  <!-- Central Badge Geometry -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <!-- Eco Leaf Icon -->
  <path d="M48 43 C56 41, 60 48, 56 55 C52 60, 44 57, 43 52 C42 47, 45 44, 48 43 Z" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <path d="M43 52 C49 51, 54 48, 56 44" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sun / Clean Energy accent -->
  <circle cx="50" cy="30" r="2.5" fill="#facc15"/>
  <!-- Bottom ISO Text -->
  <text x="50" y="67" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">ISO 14001</text>
  <text x="50" y="73.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#34d399" letter-spacing="0.8">2015 CERTIFIED</text>
  <circle cx="50" cy="50" r="47" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
