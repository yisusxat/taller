<svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g45001" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="amberRing" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow45001" x="-10" y="-10" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d97706" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#1b1406" stroke="url(#amberRing)" stroke-width="1.8" filter="url(#glow45001)"/>
  <circle cx="50" cy="50" r="42" stroke="rgba(251, 191, 36, 0.4)" stroke-width="0.75" stroke-dasharray="2 2"/>
  <!-- Middle Ring -->
  <circle cx="50" cy="50" r="38" fill="url(#g45001)" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.2"/>
  <!-- Top Arc Text / Label -->
  <path id="arc45001" d="M 22 50 A 28 28 0 0 1 78 50" fill="none"/>
  <text font-family="'Inter', system-ui, sans-serif" font-size="6.3" font-weight="800" fill="#fde68a" letter-spacing="1.2">
    <textPath href="#arc45001" startOffset="50%" text-anchor="middle">SEGURIDAD &amp; SALUD</textPath>
  </text>
  <!-- Central Badge Geometry -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <!-- Security Shield / Person Protection Icon -->
  <path d="M50 40 L58 43 C58 50 54 55 50 57 C46 55 42 50 42 43 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="46" r="2" fill="#fbbf24"/>
  <!-- Star -->
  <polygon points="50,28 51.5,31 55,31.5 52.5,33.5 53,37 50,35 47,37 47.5,33.5 45,31.5 48.5,31" fill="#facc15"/>
  <!-- Bottom ISO Text -->
  <text x="50" y="67" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">ISO 45001</text>
  <text x="50" y="73.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#fbbf24" letter-spacing="0.8">2018 CERTIFIED</text>
  <circle cx="50" cy="50" r="47" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
</svg>