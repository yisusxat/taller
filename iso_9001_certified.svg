<svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g9001" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow9001" x="-10" y="-10" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#0b1329" stroke="url(#goldRing)" stroke-width="1.8" filter="url(#glow9001)"/>
  <circle cx="50" cy="50" r="42" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.75" stroke-dasharray="2 2"/>
  <!-- Middle Ring -->
  <circle cx="50" cy="50" r="38" fill="url(#g9001)" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Top Arc Text / Label -->
  <path id="arc9001" d="M 22 50 A 28 28 0 0 1 78 50" fill="none"/>
  <text font-family="'Inter', system-ui, sans-serif" font-size="6.8" font-weight="800" fill="#bae6fd" letter-spacing="1.2">
    <textPath href="#arc9001" startOffset="50%" text-anchor="middle">CALIDAD TOTAL</textPath>
  </text>
  <!-- Central Badge Geometry -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Checkmark & Ribbon Icon -->
  <path d="M42 50 L47 55 L58 43" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stars -->
  <polygon points="50,28 51.5,31 55,31.5 52.5,33.5 53,37 50,35 47,37 47.5,33.5 45,31.5 48.5,31" fill="#facc15"/>
  <!-- Bottom ISO Text -->
  <text x="50" y="67" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">ISO 9001</text>
  <text x="50" y="73.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#38bdf8" letter-spacing="0.8">2015 CERTIFIED</text>
  <!-- Bottom Ribbon / Ticks -->
  <circle cx="50" cy="50" r="47" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
</svg>