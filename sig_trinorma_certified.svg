<svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gSig" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="purpleRing" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glowSig" x="-10" y="-10" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#150a29" stroke="url(#purpleRing)" stroke-width="1.8" filter="url(#glowSig)"/>
  <circle cx="50" cy="50" r="42" stroke="rgba(192, 132, 252, 0.4)" stroke-width="0.75" stroke-dasharray="2 2"/>
  <!-- Middle Ring -->
  <circle cx="50" cy="50" r="38" fill="url(#gSig)" fill-opacity="0.18" stroke="#c084fc" stroke-width="1.2"/>
  <!-- Top Arc Text / Label -->
  <path id="arcSig" d="M 22 50 A 28 28 0 0 1 78 50" fill="none"/>
  <text font-family="'Inter', system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#e9d5ff" letter-spacing="1.2">
    <textPath href="#arcSig" startOffset="50%" text-anchor="middle">SISTEMA INTEGRADO</textPath>
  </text>
  <!-- Central Badge Geometry -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
  <!-- Triad of Rings / Certified Synergy -->
  <circle cx="45" cy="46" r="6" stroke="#38bdf8" stroke-width="1.6" fill="none"/>
  <circle cx="55" cy="46" r="6" stroke="#34d399" stroke-width="1.6" fill="none"/>
  <circle cx="50" cy="53" r="6" stroke="#fbbf24" stroke-width="1.6" fill="none"/>
  <!-- Star -->
  <polygon points="50,28 51.5,31 55,31.5 52.5,33.5 53,37 50,35 47,37 47.5,33.5 45,31.5 48.5,31" fill="#facc15"/>
  <!-- Bottom ISO Text -->
  <text x="50" y="67" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">SIG 360°</text>
  <text x="50" y="73.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#c084fc" letter-spacing="0.8">TRI-NORMA HLS</text>
  <circle cx="50" cy="50" r="47" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
</svg>